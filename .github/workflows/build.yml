name: Build J2ME JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Download J2ME Libraries (CLDC & MIDP)
      run: |
        mkdir -p lib
        curl -sL -o lib/cldcapi11.jar https://repo1.maven.org/maven2/net/sf/microemulator/cldcapi11/2.0.3/cldcapi11-2.0.3.jar
        curl -sL -o lib/midpapi20.jar https://repo1.maven.org/maven2/net/sf/microemulator/midpapi20/2.0.3/midpapi20-2.0.3.jar

    - name: Compile and Build JAR
      run: |
        mkdir -p build/classes
        
        # Incluir rt.jar de Java 8 junto con las librerías J2ME en el bootclasspath
        javac -source 1.3 -target 1.3 \
          -bootclasspath /usr/lib/jvm/temurin-8-jdk-amd64/jre/lib/rt.jar:lib/cldcapi11.jar:lib/midpapi20.jar \
          -d build/classes src/*.java

        # Crear archivo JAR con su manifiesto
        cd build/classes
        jar cfm ../../rpg-nokia-e72.jar ../../src/META-INF/MANIFEST.MF *
        cd ../..

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nokia-e72-game
        path: rpg-nokia-e72.jar
