name: Build J2ME JAR

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    - name: Compile and Build JAR
      run: |
        mkdir -p build/classes
        # Compilar código fuente para CLDC 1.1 / MIDP 2.0
        javac -source 1.3 -target 1.3 -bootclasspath /usr/lib/jvm/temurin-8-jdk-amd64/jre/lib/rt.jar -d build/classes src/*.java || \
        javac -source 8 -target 8 -d build/classes src/*.java

        # Crear archivo JAR con su manifiesto
        cd build/classes
        jar cfm ../../rpg-nokia-e72.jar ../../src/META-INF/MANIFEST.MF *
        cd ../..

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nokia-e72-game
        path: rpg-nokia-e72.jar

